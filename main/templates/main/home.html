<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #f3f4f8;
            color: #1f2937;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 { font-size: 2rem; }
        main { max-width: 960px; margin: 32px auto 40px; padding: 0 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            border-top: 4px solid #4f46e5;
            transition: transform 0.15s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .card h2 { font-size: 1.15rem; margin-bottom: 6px; }
        .card .email { color: #6b7280; font-size: 0.9rem; word-break: break-all; }
        .badges { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .empty {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            text-align: center;
            color: #6b7280;
        }
        footer { text-align: center; color: #6b7280; padding-bottom: 32px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <h1>Student List</h1>
    </header>

    <main>
        {% if students %}
            <div class="grid">
                {% for student in students %}
                    <div class="card">
                        <h2>{{ student.first_name }} {{ student.last_name }}</h2>
                        <p class="email">{{ student.email }}</p>
                        <div class="badges">
                            <span class="badge">{{ student.course }}</span>
                            <span class="badge">Year {{ student.year_level }}</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">No students yet. Add some in the Django admin at /admin/.</div>
        {% endif %}
    </main>

    <footer>Quiz #3 &middot; Django</footer>
</body>
</html>
